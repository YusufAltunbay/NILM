# İki görünüm: panelin sol üstündeki düğmeyle değişir (seçim tarayıcıda saklanır).
[theme.dark]
primaryColor = "#12B5A6"
backgroundColor = "#0A1524"
secondaryBackgroundColor = "#16273F"
